spring.application.name=lms_mobile_backend
server.address=127.0.0.1
server.port=${SERVER_PORT:8081}
server.error.include-message=never
server.error.include-stacktrace=never

# No fallback database, account, password, or signing key. Supply explicitly at runtime.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=never
app.jwt.secret=${JWT_SECRET}
app.jwt.expirationMs=3600000

# Demo authentication is OFF unless BOTH local-development and an explicit flag are set.
app.demo-auth.enabled=false

# V3 Portal (DLU training portal): OFF unless tools/Start-LocalBackend.ps1 supplies app.portal.*
# from the git-ignored .local/backend.json. Never put a key here.
app.portal.enabled=false
# HTTP client debug logging would print request bodies (student IDs); keep it at INFO.
logging.level.org.springframework.web.client=INFO
logging.level.org.springframework.http=INFO

# Login (MSSV/username + password). Local BCrypt accounts come from .local\backend.json (AUTH block).
# The Moodle provider stays OFF: enabling it needs the School's written permission.
app.auth.local.enabled=false
app.auth.moodle.enabled=false
